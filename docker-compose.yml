services:
  postgres:
    image: postgres:17
    container_name: primus-postgres
    environment:
      POSTGRES_DB: primusdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - primus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: primus-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: primusdb
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-please-change-in-production-minimum-32-chars}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: primus-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  primus_pg_data:
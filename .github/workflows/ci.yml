name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: primusdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x ./backend/mvnw

      - name: Run tests
        working-directory: ./backend
        env:
          GEMINI_API_KEY: test-placeholder-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: primusdb
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: ./mvnw test
